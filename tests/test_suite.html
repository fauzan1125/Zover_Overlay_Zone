<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZoVer - Automated Test Runner & Code Audit</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <style>
    body {
      background: #0b0f19;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 30px 15px;
    }
    .test-header {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .metric-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .metric-value {
      font-size: 2.2rem;
      font-weight: 800;
    }
    .metric-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
    }
    .test-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      margin-bottom: 8px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s ease;
    }
    .test-item:hover {
      background: rgba(30, 41, 59, 0.6);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .test-item.pass {
      border-left: 4px solid #10b981;
    }
    .test-item.fail {
      border-left: 4px solid #ef4444;
      background: rgba(239, 68, 68, 0.08);
    }
    .badge-status {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }
    .badge-pass {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge-fail {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .filter-btn.active {
      background: #00f2fe !important;
      color: #0b0f19 !important;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="container" style="max-width: 900px;">
    <!-- Test Header -->
    <div class="test-header">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div>
          <h2 class="mb-1 fw-bold text-white d-flex align-items-center gap-2">
            <i class="bi bi-shield-check text-info"></i> ZoVer Logic & Unit Test Runner
          </h2>
          <p class="text-secondary mb-0 small">
            Menjalankan unit test otomatis untuk seluruh file JavaScript & logika aplikasi (TTS, Connectors, Overlay, Alerts, ViewCount).
          </p>
        </div>
        <div class="d-flex gap-2">
          <button id="btn-rerun" class="btn btn-primary px-3 py-2 fw-semibold d-flex align-items-center gap-2">
            <i class="bi bi-play-circle-fill"></i> Jalankan Ulang
          </button>
          <a href="../index.html" class="btn btn-outline-secondary px-3 py-2 fw-semibold">
            <i class="bi bi-arrow-left"></i> Dashboard
          </a>
        </div>
      </div>

      <!-- Metrics Row -->
      <div class="row g-3 mt-3">
        <div class="col-4">
          <div class="metric-card">
            <div class="metric-value text-info" id="metric-total">0</div>
            <div class="metric-label">Total Test</div>
          </div>
        </div>
        <div class="col-4">
          <div class="metric-card">
            <div class="metric-value text-success" id="metric-passed">0</div>
            <div class="metric-label">Lolos (Passed)</div>
          </div>
        </div>
        <div class="col-4">
          <div class="metric-card">
            <div class="metric-value text-danger" id="metric-failed">0</div>
            <div class="metric-label">Gagal (Failed)</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Filter & Results -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0 text-white"><i class="bi bi-list-check me-2"></i> Hasil Pemeriksaan Logic</h5>
      <div class="btn-group btn-group-sm">
        <button class="btn btn-dark filter-btn active" data-filter="all">Semua</button>
        <button class="btn btn-dark filter-btn text-success" data-filter="pass">Hanya Lolos</button>
        <button class="btn btn-dark filter-btn text-danger" data-filter="fail">Hanya Gagal</button>
      </div>
    </div>

    <!-- List of test items -->
    <div id="test-results-list">
      <div class="text-center py-5 text-secondary">
        <div class="spinner-border text-info mb-2" role="status"></div>
        <div>Menjalankan pengujian logika...</div>
      </div>
    </div>
  </div>

  <!-- Source Application JS Modules -->
  <script src="../js/tts.js"></script>
  <script src="../js/overlay.js"></script>
  <script src="../js/connectors/kick.js"></script>
  <script src="../js/connectors/youtube.js"></script>
  <script src="../js/connectors/tiktok.js"></script>
  <script src="../js/connectors/tikfinity.js"></script>
  <script src="../js/viewcount.js"></script>
  <script src="../js/alerts.js"></script>
  <script src="../js/app.js"></script>

  <!-- Test Suite Definition -->
  <script src="tests.js"></script>

  <!-- Interactive Test Runner Driver -->
  <script>
    function executeAndRender() {
      const resultsContainer = document.getElementById('test-results-list');
      resultsContainer.innerHTML = `
        <div class="text-center py-5 text-secondary">
          <div class="spinner-border text-info mb-2" role="status"></div>
          <div>Menjalankan pengujian logika...</div>
        </div>
      `;

      setTimeout(() => {
        const out = window.runAllTests();

        document.getElementById('metric-total').textContent = out.total;
        document.getElementById('metric-passed').textContent = out.passed;
        document.getElementById('metric-failed').textContent = out.failed;

        resultsContainer.innerHTML = '';

        out.results.forEach((r, idx) => {
          const item = document.createElement('div');
          item.className = `test-item ${r.status}`;
          item.dataset.status = r.status;

          const isPass = r.status === 'pass';
          item.innerHTML = `
            <div>
              <div class="fw-semibold ${isPass ? 'text-light' : 'text-danger'}">
                <i class="bi ${isPass ? 'bi-check-circle-fill text-success' : 'bi-x-circle-fill text-danger'} me-2"></i>
                ${r.name}
              </div>
              ${r.details ? `<div class="small text-warning ms-4 mt-1 font-monospace">${r.details}</div>` : ''}
            </div>
            <span class="badge-status ${isPass ? 'badge-pass' : 'badge-fail'}">
              ${isPass ? 'PASSED' : 'FAILED'}
            </span>
          `;
          resultsContainer.appendChild(item);
        });
      }, 100);
    }

    document.addEventListener('DOMContentLoaded', () => {
      executeAndRender();

      document.getElementById('btn-rerun')?.addEventListener('click', executeAndRender);

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          const filter = e.target.dataset.filter;

          document.querySelectorAll('.test-item').forEach(item => {
            if (filter === 'all' || item.dataset.status === filter) {
              item.style.display = 'flex';
            } else {
              item.style.display = 'none';
            }
          });
        });
      });
    });
  </script>
</body>
</html>
