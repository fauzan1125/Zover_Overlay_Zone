[package]
name = "zover"
version = "3.0.0"
edition = "2021"
description = "ZoVer Engine v3.0 - High-performance local streaming overlay hub"

[dependencies]
axum = { version = "0.7", features = ["ws", "query", "json"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
tower-http = { version = "0.5", features = ["cors"] }
rust-embed = { version = "8", features = ["mime-guess", "include-exclude"] }
mime_guess = "2.0"
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
